[project]
name = "lanternist"
version = "0.1.0"
description = "Turn a one-line idea into a narrated story film with local models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "nvidia-ml-py>=12.560",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
lanternist = "lanternist.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["gpu: runs real models on the local GPU (slow)"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 110
