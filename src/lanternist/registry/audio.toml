# Ambience for video models run with their own audio off.

[[model]]
id = "fal/mmaudio-v2"
label = "MMAudio v2 · fal"
capability = "audio.ambience"
provider = "fal"
family = "mmaudio"
endpoint = "fal-ai/mmaudio-v2"
commercial_use = true
licence = "fal commercial terms; confirm on the endpoint page"
durations = { min = 1, max = 30, step = 1 }
defaults = { num_steps = 25, cfg_strength = 4.5, mask_away_clip = false }
notes = "Hears the scene's clip and reads its sound line. Used only for video models that make no sound of their own."
price = { unit = "output_second", usd = "0.001", synced = "2026-09-21" }
