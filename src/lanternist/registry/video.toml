# Image-to-video. `durations` are the clip lengths a model bills, for the shot planner. Prices are
# list prices read from each fal endpoint page on 21 and 22 Sep 2026, audio off unless the model's
# own sound is the ambience we want (`audio = "ambience"`). A `quality` is the resolution a story may
# pick; its price is the matching `tiers` entry, or `usd` for the default.

[[model]]
id = "local/ltx-2.5-22b-nvfp4"
label = "LTX-2.5 22B"
capability = "video.image_to_video"
provider = "local"
engine_id = "ltx-2.5-22b-nvfp4@1"
audio = "ambience"
seed = true
commercial_use = "below_10m_revenue"
licence = "LTX-2.x Community Licence"
durations = { frames = "8k+1", fps = 24, max_seconds = 20 }
price = { unit = "output_second", gpu_seconds = 4.3 }

[[model]]
id = "fal/h3-max-turbo"
label = "MiniMax H3 Max Turbo · fal"
capability = "video.image_to_video"
provider = "fal"
family = "h3"
endpoint = "minimax/h3-max-turbo/image-to-video"
audio = "ambience"                      # no audio switch; it always returns a quiet sound bed
seed = true
durations = { min = 5, max = 15, step = 1 }
quality = { param = "resolution", options = ["480P", "768P", "1080P"], default = "768P" }
commercial_use = true
licence = "fal commercial terms; confirm on the endpoint page"
defaults = { prompt_expansion_mode = "disabled", enable_safety_checker = true }
notes = "The cheapest good video: try a whole film for cents at 480P. Prompt expansion is off so the character lock isn't rewritten."

[model.price]
unit = "output_second"
usd = "0.02"
tiers = { "480P" = "0.0125", "1080P" = "0.04" }
synced = "2026-09-22"
until = "2026-09-30"                    # fal's launch price, half the regular one
then = { unit = "output_second", usd = "0.04", tiers = { "480P" = "0.025", "1080P" = "0.08" } }

