# Narration. A voice is one of the model's presets (`voices`), or, where `clone = true`, a recording
# in voices/ it copies. `languages` are the ISO 639-1 codes it speaks, of the ones the app writes in.
# Prices and inputs were read from each fal endpoint page and its OpenAPI schema on 21 and 22 Sep 2026.

[[model]]
id = "local/qwen3-tts-1.7b"
label = "Qwen3-TTS 1.7B"
capability = "tts.speak"
provider = "local"
engine_id = "qwen3-tts-1.7b@1"
clone = true
languages = ["en", "zh", "es", "fr", "de", "it", "ja", "ko", "pt", "ru"]
commercial_use = true
licence = "Apache 2.0"
notes = "Clones one of your recordings, on this machine."
price = { unit = "audio_second", gpu_seconds = 0.46 }

[[model]]
id = "fal/qwen-3-tts-1.7b"
label = "Qwen3-TTS 1.7B · fal"
capability = "tts.speak"
provider = "fal"
family = "qwen_tts"
endpoint = "fal-ai/qwen-3-tts/text-to-speech/1.7b"
endpoints = { clone = "fal-ai/qwen-3-tts/clone-voice/1.7b" }   # clip + transcript -> speaker embedding
clone = true
voices = ["Vivian", "Serena", "Uncle_Fu", "Dylan", "Eric", "Ryan", "Aiden", "Ono_Anna", "Sohee"]
languages = ["en", "zh", "es", "fr", "de", "it", "ja", "ko", "pt", "ru"]
commercial_use = true
licence = "Apache 2.0 model; fal commercial terms"
# The endpoint's max_new_tokens of 200 cuts long chunks short; the rest are its defaults, stated.
defaults = { max_new_tokens = 4096, temperature = 0.9, top_k = 50, top_p = 1.0, repetition_penalty = 1.05 }
notes = "The same model as on this machine: it clones your recordings, or speaks in one of its own voices."
price = { unit = "1k_chars", usd = "0.09", tiers = { clone = "0.0008" }, synced = "2026-09-21" }

[[model]]
id = "fal/elevenlabs-v3"
label = "ElevenLabs v3 · fal"
capability = "tts.speak"
provider = "fal"
family = "elevenlabs"
endpoint = "fal-ai/elevenlabs/tts/eleven-v3"
voices = [
  "Rachel", "Aria", "Sarah", "Laura", "Charlotte", "Alice", "Matilda", "Jessica", "Lily",
  "Roger", "Charlie", "George", "Callum", "River", "Liam", "Will", "Eric", "Chris", "Brian", "Daniel", "Bill",
]
languages = ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "ja", "ko"]
commercial_use = true
licence = "fal commercial terms; confirm on the endpoint page"
defaults = { stability = 0.5, apply_text_normalization = "auto" }
notes = "The most expressive storyteller. Its own voices only: no cloning from a recording."
price = { unit = "1k_chars", usd = "0.10", synced = "2026-09-21" }

[[model]]
id = "fal/minimax-speech-2.8-hd"
label = "MiniMax Speech 2.8 HD · fal"
capability = "tts.speak"
provider = "fal"
family = "minimax"
endpoint = "fal-ai/minimax/speech-2.8-hd"
voices = [
  "Wise_Woman", "Calm_Woman", "Friendly_Person", "Inspirational_girl", "Lively_Girl", "Lovely_Girl",
  "Sweet_Girl_2", "Exuberant_Girl", "Abbess", "Deep_Voice_Man", "Casual_Guy", "Patient_Man",
  "Young_Knight", "Determined_Man", "Decent_Boy", "Imposing_Manner", "Elegant_Man",
]
languages = ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "ja", "ko"]
commercial_use = true
licence = "fal commercial terms; confirm on the endpoint page"
# output_format "hex" (the default) would put the audio in the response body.
defaults = { output_format = "url", voice_setting = { speed = 1.0, vol = 1.0, pitch = 0 }, audio_setting = { format = "mp3", sample_rate = 32000, bitrate = 128000, channel = 1 } }
notes = "Warm, clear voices, strong in Chinese and many other languages."
price = { unit = "1k_chars", usd = "0.10", synced = "2026-09-21" }

[[model]]
id = "fal/chatterbox-multilingual"
label = "Chatterbox Multilingual · fal"
capability = "tts.speak"
provider = "fal"
family = "chatterbox"
endpoint = "fal-ai/chatterbox/text-to-speech/multilingual"
clone = true
seed = true
max_chars = 300
